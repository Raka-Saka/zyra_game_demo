<!DOCTYPE html>
<html>
<head>
    <title>Interactive NPC Environment Visualization</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive visualization of NPCs with dynamic behaviors and environmental influences">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
        }
        canvas {
            border: 1px solid black;
            margin-bottom: 20px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .info-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 10px;
            max-width: 800px;
            width: 100%;
        }
        .panel {
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .panel h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 5px;
        }
        .event-log div {
            margin: 5px 0;
            padding: 8px;
            background-color: #f9f9f9;
            border-radius: 4px;
            border-left: 3px solid #4CAF50;
        }
        .faction-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .faction-item {
            display: flex;
            flex-direction: column;
            padding: 10px;
            margin: 5px 0;
            background-color: #f9f9f9;
            border-radius: 4px;
            border-left: 3px solid #2196F3;
        }
        .faction-item > span {
            margin: 2px 0;
        }
        .faction-relations {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid #ddd;
        }
        .event-details {
            margin-top: 5px;
            padding: 8px;
            background-color: #f0f0f0;
            border-radius: 4px;
        }
        .event-participants {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }
        .participant-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .event-factions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            padding: 5px;
            background-color: #fff;
            border-radius: 4px;
        }
        .faction-dot {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .story-progress {
            width: 100%;
            height: 10px;
            background-color: #eee;
            border-radius: 5px;
            margin-top: 5px;
        }
        .progress-bar {
            height: 100%;
            background-color: #4CAF50;
            border-radius: 5px;
            transition: width 0.3s ease-in-out;
        }
        .agent-decision {
            padding: 8px;
            margin: 5px 0;
            background-color: #e3f2fd;
            border-radius: 4px;
            border-left: 3px solid #1976D2;
        }
        .agent-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .stat-item {
            padding: 5px;
            background-color: #f5f5f5;
            border-radius: 4px;
            text-align: center;
        }
        #github-link {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px;
            background-color: #24292e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }
        #github-link:hover {
            background-color: #2c3238;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <div class="info-panel">
        <div class="panel event-log" id="eventLog">
            <h3>Recent Events</h3>
            <div id="currentEvent"></div>
        </div>
        <div class="panel faction-panel" id="factionPanel">
            <h3>Active Factions</h3>
            <ul class="faction-list" id="factionList"></ul>
        </div>
        <div class="panel world-panel" id="worldPanel">
            <h3>World State</h3>
            <div id="weatherInfo"></div>
            <div id="timeInfo"></div>
            <div id="seasonInfo"></div>
            <div id="storylineInfo"></div>
            <div class="agent-stats" id="agentStats">
                <div class="stat-item">NPCs: <span id="npcCount">0</span></div>
                <div class="stat-item">Places: <span id="placeCount">0</span></div>
                <div class="stat-item">Events: <span id="eventCount">0</span></div>
                <div class="stat-item">Factions: <span id="factionCount">0</span></div>
            </div>
            <div id="agentDecisions"></div>
        </div>
    </div>

    <a href="https://github.com/yourusername/npc-visualization" id="github-link" target="_blank">View on GitHub</a>

    <script src="js/narrative_agent.js"></script>
    <script src="js/visualization.js"></script>
</body>
</html>
